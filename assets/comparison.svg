<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="GoodSticky compared with Apple Stickies">
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.ink{fill:#24292f}.muted{fill:#6e7781}.good{fill:#b97527}.apple{fill:#9ba3ad}@media(prefers-color-scheme:dark){.ink{fill:#e6edf3}.muted{fill:#8b949e}.good{fill:#e7b260}.apple{fill:#66717e}}</style>
<g transform="translate(12,0)"><text class="muted" x="0" y="22" font-size="12" letter-spacing="1">MEMORY FOOTPRINT</text>
<text class="ink" x="0" y="55" font-size="15">GoodSticky</text><text class="ink" x="306" y="55" text-anchor="end" font-size="22" font-weight="600">18 MB</text><rect class="good" x="0" y="67" width="172.1" height="5" rx="2.5"/>
<text class="ink" x="0" y="110" font-size="15">Apple Stickies</text><text class="ink" x="306" y="110" text-anchor="end" font-size="22" font-weight="600">32 MB</text><rect class="apple" x="0" y="122" width="306.0" height="5" rx="2.5"/>
</g>
<g transform="translate(390,0)"><text class="muted" x="0" y="22" font-size="12" letter-spacing="1">LAUNCH CPU</text>
<text class="ink" x="0" y="55" font-size="15">GoodSticky</text><text class="ink" x="306" y="55" text-anchor="end" font-size="22" font-weight="600">0.14 s</text><rect class="good" x="0" y="67" width="126.0" height="5" rx="2.5"/>
<text class="ink" x="0" y="110" font-size="15">Apple Stickies</text><text class="ink" x="306" y="110" text-anchor="end" font-size="22" font-weight="600">0.34 s</text><rect class="apple" x="0" y="122" width="306.0" height="5" rx="2.5"/>
</g>
</svg>
