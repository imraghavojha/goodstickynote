name: Native macOS checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model, persistence, and AppKit checks
        run: ./scripts/test.sh
      - name: Build native app
        run: ./scripts/build.sh
      - name: Atomic installer checks
        run: ./scripts/test-install.sh
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/GoodSticky.app dist/GoodSticky-macOS.zip
      - name: Upload local app build
        uses: actions/upload-artifact@v4
        with:
          name: GoodSticky-macOS
          path: dist/GoodSticky-macOS.zip
